<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIDos Translate</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        width: 220px;
        font-family: Arial, sans-serif;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 14px;
      }

      .actions {
        display: grid;
        gap: 8px;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
        cursor: pointer;
      }

      #translate {
        background: #2563eb;
        color: #fff;
      }

      #restore {
        background: #e5e7eb;
        color: #111827;
      }

      #status {
        margin-top: 8px;
        font-size: 12px;
        color: #4b5563;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <h1>英文 → 中文翻譯</h1>
    <div class="actions">
      <button id="translate">翻譯目前頁面</button>
      <button id="restore">還原原文</button>
    </div>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
